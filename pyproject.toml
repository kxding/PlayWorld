[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playworldbench"
version = "0.1.0"
description = "Gemini metrics and browser-agent control for PlayWorld"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0",
  "Pillow>=10.0.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0"]
automatic = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "torch>=2.1",
  "transformers>=4.40",
  "ultralytics>=8.3",
]
vbench = ["vbench>=0.1.2"]
all-metrics = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "torch>=2.1",
  "transformers>=4.40",
  "ultralytics>=8.3",
  "vbench>=0.1.2",
]

[project.scripts]
playworld-eval = "playworldbench.cli.evaluate:main"
playworld-aggregate = "playworldbench.cli.aggregate:main"
playworld-auto-metrics = "playworldbench.cli.automatic:main"
playworld-agent = "playworldbench.agent_cli:main"

[tool.setuptools.packages.find]
include = ["playworldbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
